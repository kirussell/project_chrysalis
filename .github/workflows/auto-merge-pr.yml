name: Auto Merge on Conditions

on:
  issue_comment:
    types: [created]
  status:
  check_suite:
    types: [completed]
    branches-ignore:
      - 'main'
      - 'master'
  check_run:
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.issue.number || github.event.check_suite.pull_requests[0].number || github.event.check_run.pull_requests[0].number || github.sha }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (github.event_name == 'check_suite' && github.event.check_suite.pull_requests[0]) ||
      (github.event_name == 'check_run' && github.event.check_run.pull_requests[0] &&
        github.event.check_run.check_suite.head_branch != 'main' &&
        github.event.check_run.check_suite.head_branch != 'master') ||
      (github.event_name == 'status' &&
        !contains(github.event.branches.*.name, 'main') &&
        !contains(github.event.branches.*.name, 'master'))
    runs-on: [self-hosted]
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      statuses: read
    steps:
      - name: Check if auto-merge conditions are met
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get PR number from the event
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue?.number;
              // Skip if not a PR
              if (!context.payload.issue?.pull_request) {
                console.log('Not a pull request, skipping');
                return;
              }
            } else if (context.eventName === 'check_suite') {
              const pullRequests = context.payload.check_suite?.pull_requests || [];
              if (pullRequests.length === 0) {
                console.log('No pull requests associated with this check suite, skipping');
                return;
              }
              prNumber = pullRequests[0].number;
            } else if (context.eventName === 'check_run') {
              const pullRequests = context.payload.check_run?.pull_requests || [];
              if (pullRequests.length === 0) {
                console.log('No pull requests associated with this check run, skipping');
                return;
              }
              prNumber = pullRequests[0].number;
            } else if (context.eventName === 'status') {
              // For status events, we need to find PRs that include this commit
              const commit_sha = context.payload.sha;
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: commit_sha
              });
              
              if (prs.length === 0) {
                console.log('No pull requests associated with this status event, skipping');
                return;
              }
              
              // Use the first open PR
              const openPr = prs.find(pr => pr.state === 'open');
              if (!openPr) {
                console.log('No open pull requests associated with this status event, skipping');
                return;
              }
              prNumber = openPr.number;
            }
            
            if (!prNumber) {
              console.log('Could not determine PR number, skipping');
              return;
            }

            console.log(`Checking auto-merge conditions for PR #${prNumber}`);

            // Fetch the PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Skip if PR is already merged or closed
            if (pr.state !== 'open') {
              console.log(`PR #${prNumber} is ${pr.state}, skipping`);
              return;
            }

            // Condition 1: Check if Gemini has left review comments
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const geminiReview = reviews.find(review =>
              review.user.login.toLowerCase().includes('gemini')
            );

            if (!geminiReview) {
              console.log('Condition 1 failed: No Gemini review found');
              return;
            }
            console.log('Condition 1 passed: Gemini review found');

            // Condition 2: Check if the specific Claude trigger comment exists
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const claudeTriggerComment = comments.find(comment =>
              comment.body.includes('@claude check all comments in this PR and address them, commit changes to this branch')
            );

            if (!claudeTriggerComment) {
              console.log('Condition 2 failed: Claude trigger comment not found');
              return;
            }
            console.log('Condition 2 passed: Claude trigger comment found');

            // Get the last comment in the array to check for failures
            const lastComment = comments[comments.length - 1];
            // Check if the last comment exists and includes the trigger
            const isLastFailed = lastComment && lastComment.body.includes('Claude encountered an error');
            if (isLastFailed) {
              console.log('Condition 2 failed: Claude failed on last command');
              return;
            }

            console.log('Condition 2 passed: Claude trigger is the latest message');

            // Condition 3: Check if CI is green (all checks pass)
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            const allChecksPassed = checkRuns.check_runs.every(check =>
              check.status === 'completed' && (check.conclusion === 'success' || check.conclusion === 'skipped')
            );

            if (!allChecksPassed) {
              console.log('Condition 3 failed: Not all checks have passed');
              const failedChecks = checkRuns.check_runs.filter(check =>
                check.status !== 'completed' || (check.conclusion !== 'success' && check.conclusion !== 'skipped')
              );
              console.log('Failed/pending checks:', failedChecks.map(c => `${c.name}: ${c.status}/${c.conclusion}`));
              return;
            }
            console.log('Condition 3 passed: All CI checks are green');

            // Also check commit statuses (some CI systems use statuses instead of checks)
            const { data: statuses } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            if (statuses.state !== 'success' && statuses.statuses.length > 0) {
              console.log(`Condition 3 failed: Combined status is ${statuses.state}, not success`);
              return;
            }

            // All conditions met - perform squash and merge
            console.log('All conditions met! Attempting to squash and merge PR #' + prNumber);

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: pr.title,
                commit_message: `${pr.body || ''}\n\nAuto-merged after Gemini review and Claude fixes with passing CI`
              });

              console.log(`Successfully merged PR #${prNumber}`);

              // Post a comment about the auto-merge
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '✅ Auto-merged: All conditions met (Gemini review, Claude fixes applied, CI green)'
              });
            } catch (error) {
              console.error('Failed to merge PR:', error.message);

              // Post a comment about the failure
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ Auto-merge failed: ${error.message}\n\nAll conditions were met, but the merge failed. You may need to merge manually.`
              });
            }