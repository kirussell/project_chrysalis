name: Gemini to Claude Review Handler

on:
  pull_request_review:
    types: [submitted]

jobs:
  trigger-claude:
    # Only run if the review/comment is from Gemini code assistant and PR is open
    if: |
      (github.event_name == 'pull_request_review' && contains(github.event.review.user.login, 'gemini') && github.event.pull_request.state == 'open')
    runs-on: [self-hosted]
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Check if last review is from Gemini
        id: check_last_comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_PAT }}
          script: |
            const prNumber = context.payload.pull_request.number;

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const lastReview = reviews.data[reviews.data.length - 1];
            const isGemini = lastReview
              && lastReview.user.login.includes('gemini')
              && lastReview.body.includes('Code Review');
            console.log(`Last review is from: ${lastReview ? lastReview.user.login : 'N/A'}`);
            console.log(`Last review body includes "Code Review": ${lastReview ? lastReview.body.includes('Code Review') : false}`);

            core.setOutput('skip_trigger', isGemini);
            console.log(`Last review is from Gemini with Code Review: ${isGemini}`);

            return isGemini;

      - name: Post Claude trigger comment
        if: steps.check_last_comment.outputs.skip_trigger == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_PAT }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const comment = '@claude check all comments in this PR and address them, commit changes to this branch';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

            console.log(`Posted Claude trigger comment to PR #${prNumber}`);