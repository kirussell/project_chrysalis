name: Create PR from Link

on:
  issue_comment:
    types: [created, edited]

jobs:
  create-pr-from-link:
    # Only run on issue comments (not PR comments) with the "WIP" label
    if: github.event.issue && !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'WIP')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check for Create PR link
        id: check-link
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;

            // Regex to match GitHub PR creation URLs
            // Format: https://github.com/owner/repo/compare/base...branch?quick_pull=1&title=<title>&body=<body>
            const linkRegex = /https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/compare\/(.+?)\.\.\.([^?]+)\?quick_pull=1&title=([^&]+)&body=(.*)/g;

            const matches = [...comment.matchAll(linkRegex)];

            if (matches.length === 0) {
              console.log('No Create PR links found in comment');
              return null;
            }

            // Process the first match
            const match = matches[0];
            const [fullUrl, owner, repo, base, branch, encodedTitle, encodedBody] = match;

            // Decode URL-encoded components
            const title = decodeURIComponent(encodedTitle);
            const body = decodeURIComponent(encodedBody);

            console.log(`Found Create PR link:`);
            console.log(`  Base: ${base}`);
            console.log(`  Branch: ${branch}`);
            console.log(`  Title: ${title}`);
            console.log(`  Body: ${body.substring(0, 100)}...`);

            // Set individual outputs instead of returning JSON
            core.setOutput('found', 'true');
            core.setOutput('owner', owner);
            core.setOutput('repo', repo);
            core.setOutput('base', base);
            core.setOutput('branch', branch);
            core.setOutput('title', title);
            core.setOutput('body', body);
            return;

      - name: Checkout repository
        if: steps.check-link.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        if: steps.check-link.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.USER_PAT }}
          BASE: ${{ steps.check-link.outputs.base }}
          BRANCH: ${{ steps.check-link.outputs.branch }}
          TITLE: ${{ steps.check-link.outputs.title }}
          BODY: ${{ steps.check-link.outputs.body }}
        run: |
          # Use environment variables to avoid command injection

          # Verify the branch exists
          if ! git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Error: Branch '$BRANCH' does not exist on remote"
            exit 1
          fi

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base "$BASE" --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request already exists: #$EXISTING_PR"
            echo "URL: https://github.com/${{ github.repository }}/pull/$EXISTING_PR"

            # Comment on the issue with the existing PR link
            echo "A pull request already exists for branch \`$BRANCH\` → \`$BASE\`: #$EXISTING_PR"
          else
            # Create the pull request
            PR_URL=$(gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY")

            echo "Created pull request: $PR_URL"

            # Extract PR number from URL using gh pr view
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')

            # Comment on the issue with success message
            gh issue comment ${{ github.event.issue.number }} --body "✅ Successfully created pull request: #$PR_NUMBER\n\n**Title:** $TITLE\n\n[View Pull Request]($PR_URL)"
          fi

      - name: Handle errors
        if: failure() && steps.check-link.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "❌ Failed to create pull request. Please check the workflow logs for details."
